<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<style>
  /* The living mark — the same motion as the sakwala.dev hero (site.css), carried inside the file.
     Geometry is marks/sakwala-mark.svg, untouched. */
  path {
    stroke-dasharray: 400;
    stroke-dashoffset: 0;
    animation: skw-ringdraw 1.4s cubic-bezier(0.25, 0.1, 0.25, 1) both;
  }
  path:nth-of-type(-n + 4) { animation-delay: 0.1s; }
  path:nth-of-type(n + 5):nth-of-type(-n + 8) { animation-delay: 0.22s; }
  path:nth-of-type(n + 9):nth-of-type(-n + 12) { animation-delay: 0.34s; }
  path:nth-of-type(n + 13):nth-of-type(-n + 16) { animation-delay: 0.46s; }
  path:nth-of-type(n + 17):nth-of-type(-n + 20) { animation-delay: 0.58s; }
  path:nth-of-type(n + 21):nth-of-type(-n + 24) { animation-delay: 0.7s; }
  path:nth-of-type(n + 25) { animation-delay: 0.82s; }
  circle:last-of-type {
    transform-box: view-box;
    transform-origin: 50% 50%;
    animation: skw-orbit 90s linear infinite;
  }
  @keyframes skw-ringdraw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
  @keyframes skw-orbit { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    path { animation: none; stroke-dashoffset: 0; }
    circle:last-of-type { animation: none; }
  }
</style>
